# Day-label correction (user 2026-10-06: rainfall only; target = BMKG official convention).
daylabel:
  variables: [RR]
  countries: [ID]         # target lags calibrated on Indonesian data only; AU etc. left unverified (F39)
  target: "24 h ending 07:00 local, labelled with the end date (BMKG Data Online FAQ)"
  lags: [-2, -1, 0, 1]
  window_days: 120        # provisional
  step_days: 30
  min_pairs: 60
  min_margin: 0.1         # provisional; F19 median margin 0.33
  min_run_blocks: 2
  gridded_references:
    - name: imerg_final
      path: F:/temp/hybrid-bias-correction/data/input/imergf/idn_imergf.nc4
      variable: precipitation
      start: "2001-01-01"
      target_lag: -1      # correctly labelled series match IMERG day D-1 (F19)
    - name: cpc_uni
      path: F:/temp/station/cpc/idn_cpc_1979_2025.nc   # subset of user's PSL CPC V1.0 yearly files
      variable: precip
      start: "1979-01-01"
      target_lag: -1      # measured: IMERG-verified BMKG matches CPC at -1 in 2,043/2,089 series-years (F38)
  # SACA&D originals are NOT stable before 2001 against CPC (F38), so no pairwise reference.
  pairwise_reference_sources: []
  overrides:              # [{series_id, start, end, offset}]; start/end are form dates (date_raw)
    # agro:MOJOSARI: /qc 2026-11-25 (F66, tools/qc_mojosari_lag.py, qc_mojosari_proposal.py), adopted by user 2026-11-25
    - {series_id: "agro:MOJOSARI:RR", start: "1973-01-01", end: "1976-10-31", offset: 1}   # neighbours_only
    - {series_id: "agro:MOJOSARI:RR", start: "1976-11-01", end: "1977-05-31", offset: 0}   # neighbours_only
    - {series_id: "agro:MOJOSARI:RR", start: "1977-06-01", end: "1981-06-08", offset: 1}   # supported
    - {series_id: "agro:MOJOSARI:RR", start: "1981-06-09", end: "1984-02-29", offset: 2}   # supported
    - {series_id: "agro:MOJOSARI:RR", start: "1984-03-01", end: "1986-02-28", offset: 1}   # supported
    - {series_id: "agro:MOJOSARI:RR", start: "1986-03-01", end: "1988-03-31", offset: 0}   # supported
    - {series_id: "agro:MOJOSARI:RR", start: "1988-04-01", end: "1994-12-31", offset: 1}   # supported

qc:
  exclusions:                  # tools/build_qc_exclusions.py from the /qc tables (user 2026-10-07)
    - F:/temp/station/compiled/qc/exclusions_rr.csv
    - F:/temp/station/compiled/qc/flags_rr_mojosari.csv   # tools/build_qc_flags_mojosari.py (F66, user 2026-11-25); `flag` column: review flags stay in merged views
    - F:/temp/station/compiled/qc/flags_rr_pu_sihka.csv   # copy of qc_pu_sihka/proposed_exclusions_pu_sihka.csv (tools/qc_pu_sihka_proposal.py), adopted by user 2026-11-26 (F76)

merge:
  priority: [bmkg_xlsx, chind, fklim_sumatera, sacad_nonblend, sacad2013_extra, knmi, asean_comp, jatim, pu_sihka, agro, sumbar_daily, bmg_posts, larantuka, sumsel_posts, ghcnd, sacad_blend_synop]
  extend_after_primary: true
  exclude_sources:             # kept in observations, left out of the merged view (user 2026-10-07)
    RR: [ghcnd, sacad_blend_synop]   # GTS-derived, UTC-labelled, incomplete daily totals (F22-F23)   # user 2026-10-06: failed fillers may extend past the primary, flagged
  netcdf_start: "1950-01-01"

# Deliverables (python -m wxgrid export <config> <job>)
export:
  rainfall:
    variable: RR
    countries: [ID]
    start: "1866-01-01"        # first merged RR value in Indonesia (SACA&D); 591,134 site-days at 59 Indonesian sites before 1950 (user 2026-11-25)
    end: "2025-12-31"          # user 2026-11-25: median sites/day 490 (2022), 34 (2023, PU portal gap), 400 (2024), 365 (2025); 2026 has 2
    out_dir: F:/temp/station/compiled/export
    prefix: idn_rr_daily_1866_2025
    mirror_dir: data              # copy of the draft release, tracked in git (user 2026-11-26)
